<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sidekick</title>
    <style>
      :root { --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --primary: #1f883d; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d1117; --ink: #e6edf3; --muted: #7d8590; --primary: #238636; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Noto Sans Georgian", "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 320px; display: grid; gap: 12px; justify-items: center; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; color: var(--muted); font-size: 15px; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 12px 28px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Shown by Capacitor (server.errorPath) when the dashboard cannot load. -->
    <main>
      <h1>ინტერნეტი არ არის</h1>
      <p>შეამოწმე კავშირი და სცადე ხელახლა.</p>
      <p lang="en">No internet connection. Check it and try again.</p>
      <button type="button" id="retry">ხელახლა ცდა · Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace("https://sidekick.ge/dashboard");
      });
    </script>
  </body>
</html>
